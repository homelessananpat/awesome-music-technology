<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Awesome Music Technology</title>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
  }

  body {
    font-family: 'Noto Sans Mono', monospace;
    max-width: 900px;
    padding: 20px;
    line-height: 1.6;
    background-color: #000000;
    color: #00ff00;
    text-align: left;
    overflow-x: auto;
  }

  img {
    max-width: 100%;
    height: auto;
  }

  pre {
    overflow-x: auto;
  }

  a {
    color: #00ff00;
    white-space: nowrap;
    word-break: normal;
  }
</style>
</head>

<body>
  <div id="readme">Loading...</div>

  <script>
    function sendHeight() {
      window.parent.postMessage(
        {
          type: "github-page-height",
          height: document.documentElement.scrollHeight
        },
        "*"
      );
    }

    fetch("https://raw.githubusercontent.com/homelessananpat/awesome-music-technology/main/README.md")
      .then(response => {
        if (!response.ok) {
          throw new Error("Could not load README");
        }
        return response.text();
      })
      .then(markdown => {
        document.getElementById("readme").innerHTML = marked.parse(markdown);

        // Wait for the README to render
        sendHeight();

        // Send again after images finish loading
        document.querySelectorAll("img").forEach(img => {
          img.addEventListener("load", sendHeight);
        });
      })
      .catch(error => {
        document.getElementById("readme").textContent =
          "Failed to load README.";
        console.error(error);
        sendHeight();
      });

    // Detect any future changes in page size
    const observer = new ResizeObserver(sendHeight);
    observer.observe(document.body);
  </script>
</body>
</html>
